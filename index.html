                <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catálogo Atacado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 10px;
    }

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .product {
      background: #1e1e1e;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .product img {
      width: 80px;
      border-radius: 8px;
    }

    .product input {
      width: 60px;
      padding: 5px;
    }

    .form {
      margin-top: 30px;
      background: #1e1e1e;
      padding: 15px;
      border-radius: 10px;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      background: #4CAF50;
      color: white;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Catálogo Atacado</h1>

  <div class="product">
    <img src="https://via.placeholder.com/80" alt="Camisa Preta">
    <div>
      <strong>Camisa Dry-Fit Preta</strong><br>
      R$ 30,00<br>
      <label>Qtd: <input type="number" min="0" value="0" data-name="Camisa Dry-Fit Preta" data-price="30"></label>
    </div>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/80" alt="Camisa Branca">
    <div>
      <strong>Camisa Dry-Fit Branca</strong><br>
      R$ 30,00<br>
      <label>Qtd: <input type="number" min="0" value="0" data-name="Camisa Dry-Fit Branca" data-price="30"></label>
    </div>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/80" alt="Camisa Azul">
    <div>
      <strong>Camisa Dry-Fit Azul</strong><br>
      R$ 30,00<br>
      <label>Qtd: <input type="number" min="0" value="0" data-name="Camisa Dry-Fit Azul" data-price="30"></label>
    </div>
  </div>

  <div class="form">
    <input type="text" id="client-name" placeholder="Seu nome">
    <input type="tel" id="client-number" placeholder="Seu número de WhatsApp">
    <button onclick="sendOrder()">Finalizar Pedido</button>
  </div>

  <script>
    function sendOrder() {
      const name = document.getElementById("client-name").value.trim();
      const number = document.getElementById("client-number").value.trim();
      const inputs = document.querySelectorAll("input[type='number']");
      let msg = `*Novo Pedido Atacado*%0A%0A*Cliente:* ${name}%0A*WhatsApp:* ${number}%0A%0A*Itens:*%0A`;
      let total = 0;
      let hasItem = false;

      inputs.forEach(input => {
        const qty = parseInt(input.value);
        const product = input.dataset.name;
        const price = parseFloat(input.dataset.price);
        if (qty > 0) {
          msg += `- ${product} x${qty} (R$${qty * price})%0A`;
          total += qty * price;
          hasItem = true;
        }
      });

      if (!name || !number || !hasItem) {
        alert("Preencha todos os campos e escolha pelo menos um item.");
        return;
      }

      msg += `%0A*Total:* R$${total},00`;
      const whatsappURL = `https://wa.me/5581973446134?text=${msg}`;
      window.open(whatsappURL, "_blank");
    }
  </script>
</body>
</html>
